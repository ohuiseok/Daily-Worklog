<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Worklog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --blue: #2563eb;
        --green: #15803d;
        --green-soft: #ecfdf3;
        --red: #b42318;
        --red-soft: #fef3f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 13px;
      }

      main {
        padding: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 750;
        line-height: 1.25;
      }

      .subtitle {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .status-pill {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status-pill.is-off {
        background: var(--red-soft);
        color: var(--red);
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      .stat {
        min-height: 74px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .stat-wide {
        grid-column: 1 / -1;
        min-height: 68px;
      }

      .label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        line-height: 1.2;
      }

      .value {
        display: block;
        margin-top: 7px;
        color: var(--text);
        font-size: 22px;
        font-weight: 760;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .value-small {
        font-size: 13px;
        font-weight: 650;
        line-height: 1.35;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #ffffff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        cursor: default;
        background: #93a4bd;
      }

      #popup-status {
        min-height: 18px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      #popup-status.is-success {
        color: var(--green);
      }

      #popup-status.is-error {
        color: var(--red);
      }
    </style>
    <script type="module" crossorigin src="/popup.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
    <link rel="modulepreload" crossorigin href="/assets/activityStore.js">
    <link rel="modulepreload" crossorigin href="/assets/settingsStore.js">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Browser Worklog</h1>
          <p class="subtitle">브라우저 작성 기록</p>
        </div>
        <span id="capture-status" class="status-pill">확인 중</span>
      </header>

      <section class="stats" aria-label="작업 기록 상태">
        <div class="stat">
          <span class="label">오늘 기록</span>
          <span id="today-chunks" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">대기 날짜</span>
          <span id="pending-days" class="value value-small">없음</span>
        </div>
        <div class="stat stat-wide">
          <span class="label">마지막 업로드</span>
          <span id="last-upload" class="value value-small">없음</span>
        </div>
      </section>

      <button id="manual-upload" type="button">지금 업로드</button>
      <p id="popup-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
